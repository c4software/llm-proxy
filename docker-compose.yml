services:
  albert-proxy:
    # Contexte à la racine : l'image embarque data/config.example.toml
    # (le .dockerignore n'y laisse que proxy/ et ce modèle).
    build:
      context: .
      dockerfile: proxy/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    # config.toml et stats.db survivent aux redémarrages et aux rebuilds.
    volumes:
      - ./data:/app/data
    # ./data appartient à l'hôte : écrire avec son uid, sinon le montage
    # n'est pas inscriptible et les fichiers créés exigent sudo.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Les secrets seulement, injectés dans le TOML par «${VAR}» ; les
      # réglages vivent dans le TOML. Les variables vides sont sans effet.
      ALBERT_API_KEY: "${ALBERT_API_KEY}"
      # [tools.code_execution].token ; le service est dans l'override.
      EXECUTOR_TOKEN: "${EXECUTOR_TOKEN:-}"
      # Le rendu des pages (browserless, dans l'override) : son jeton
      # ([tools.web_fetch].render_token), et les domaines internes que le
      # navigateur ne joint jamais (séparés par des virgules ; ici et non
      # dans le dépôt ni le TOML).
      BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN:-}"
      RENDER_BLOCKED_HOSTS: "${RENDER_BLOCKED_HOSTS:-}"
      # Si [proxy].api_keys référence «${PROXY_API_KEY}».
      PROXY_API_KEY: "${PROXY_API_KEY:-}"
      # [oidc].client_id et client_secret, si les comptes sont actifs.
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # CONFIG_PATH: /app/data/config.toml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Métamoteur de l'outil `web_search` ([tools.web_search]). Pas de
  # `depends_on` : SearXNG en panne, seule la recherche échoue.
  searxng:
    # Tag daté plutôt que `latest`, pour qu'un `docker compose pull` ne
    # change pas de version. Mise à jour : changer le tag
    # (https://hub.docker.com/r/searxng/searxng/tags). Même image sur
    # ghcr.io/searxng/searxng si Docker Hub limite les téléchargements.
    image: docker.io/searxng/searxng:2026.10.4-d48c4b555
    restart: unless-stopped
    # Pas de `ports:`, volontairement : l'instance n'a pas de limiteur et
    # ne doit être joignable que du proxy (searxng:8080).
    volumes:
      # Le fichier seul, en lecture seule : monté en dossier, le point
      # d'entrée (root) en ferait un `chown -R` vers son uid 977.
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    environment:
      # Surcharge `server.secret_key`, depuis .env. Sans `:?` exprès : une
      # variable absente bloquerait toute une pile à `include`. Vide,
      # SearXNG démarre quand même et compose avertit ; autant la poser.
      SEARXNG_SECRET: "${SEARXNG_SECRET:-}"
      # Ne jamais changer le propriétaire de ce qui vient de l'hôte.
      FORCE_OWNERSHIP: "false"
    # Le Python de l'image : elle n'embarque pas curl.
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  searxng-cache:
