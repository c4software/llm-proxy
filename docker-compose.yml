services:
  albert-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Config (config.toml) et base de statistiques (stats.db) : le volume
    # les garde au travers des redémarrages et des rebuilds d'image.
    volumes:
      - ./data:/app/data
    # ./data appartient à l'hôte : le conteneur doit écrire config.toml et
    # stats.db avec cet uid, sinon le montage n'est pas inscriptible et les
    # fichiers créés ne seraient pas éditables sans sudo.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Les SECRETS seulement : injectés dans le TOML par «${VAR}»
      # (voir data/config.example.toml). Les réglages vivent dans le TOML.
      ALBERT_API_KEY: "${ALBERT_API_KEY}"
      # Le jeton de l'exécuteur de code ([tools.code_execution].token).
      # Vide tant que l'outil n'est pas mis en route : sans effet.
      EXECUTOR_TOKEN: "${EXECUTOR_TOKEN:-}"
      # CONFIG_PATH: /app/data/config.toml
    # Dès qu'un service nomme ses réseaux il quitte `default` s'il ne le
    # nomme pas : les deux, donc.
    networks:
      - default     # searxng, et la sortie vers les backends
      - sandbox     # l'exécuteur de code, et rien d'autre
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Métamoteur de recherche de l'outil hébergé `web_search` : le proxy
  # l'interroge en JSON (GET http://searxng:8080/search?q=…&format=json,
  # voir [tools.web_search] dans data/config.example.toml). Le proxy n'en
  # dépend PAS pour démarrer — pas de `depends_on` : SearXNG en panne, la
  # recherche rend une erreur au modèle, le reste du proxy sert.
  searxng:
    # Tag daté (`AAAA.M.J-<commit>`, un par build de master), pas `latest` :
    # l'image fige ses dépendances Python, autant que la version de SearXNG
    # ne bouge pas non plus sous un `docker compose pull`. Mise à jour :
    # changer le tag (https://hub.docker.com/r/searxng/searxng/tags), puis
    # `docker compose up -d searxng`. Même image sur ghcr.io/searxng/searxng
    # si Docker Hub limite les téléchargements.
    image: docker.io/searxng/searxng:2026.10.4-d48c4b555
    restart: unless-stopped
    # PAS de `ports:` — volontaire. L'instance n'a pas de limiteur
    # (searxng/settings.yml) : elle ne doit être joignable que du proxy, par
    # le réseau du compose, sous le nom `searxng` et le port 8080 de l'image.
    volumes:
      # Le FICHIER seul, en lecture seule, pas le dossier : le conteneur
      # démarre en root et son point d'entrée ferait un `chown -R` du
      # dossier monté vers son utilisateur (uid 977) — ici, un dossier
      # versionné de l'hôte. Le fichier existant, il ne génère rien non plus.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      # Données persistantes de SearXNG (caches) : un volume nommé, pour
      # qu'elles survivent à la recréation du conteneur.
      - searxng-cache:/var/cache/searxng
    environment:
      # Surcharge `server.secret_key`. Jamais dans un fichier versionné :
      # elle vient de .env (voir .env.example). Volontairement SANS `:?` —
      # une variable absente n'arrête pas `docker compose`, qui dans une
      # pile à `include` bloquerait tous les autres services avec celui-ci.
      # Absente, la clé est vide : SearXNG démarre quand même (il ne refuse
      # que son défaut «ultrasecretkey»), et compose le signale par un
      # avertissement. L'instance n'est joignable que du proxy et ne sert
      # que du JSON : la clé n'y signe rien d'exposé, mais autant la poser.
      SEARXNG_SECRET: "${SEARXNG_SECRET:-}"
      # Ceinture et bretelles avec le montage du fichier seul : ne jamais
      # changer le propriétaire de ce qui vient de l'hôte.
      FORCE_OWNERSHIP: "false"
    # Même forme que celui du proxy : le Python de l'image (celui qui lance
    # le serveur), sans compter sur un curl qu'elle n'embarque pas.
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # L'exécuteur de code de l'outil hébergé `code_execution` : le SEUL
  # conteneur de la pile qui a un moteur de conteneurs (podman sans root),
  # où tournent les programmes écrits par un modèle — chacun dans un bac
  # sans réseau. Le proxy l'appelle en HTTP (http://executor:8080, voir
  # [tools.code_execution] dans data/config.example.toml), jeton à l'appui.
  # Le proxy n'en dépend PAS pour démarrer — pas de `depends_on` : exécuteur
  # absent ou en panne, l'outil rend une erreur au modèle, le reste sert.
  #
  # JAMAIS VALIDÉ sur un vrai moteur de conteneurs à ce jour : dérouler
  # `docker compose exec executor python -m executor.validate` avant
  # d'activer l'outil (README, « Exécution de code »).
  executor:
    build: ./executor
    # Sous PROFIL : l'outil est désactivé par défaut, et un `docker compose
    # up -d` ordinaire ne construit ni ne lance ce service (une grosse
    # image, un conteneur sans profil seccomp). Le mettre en route :
    #   docker compose --profile code-execution up -d --build
    # (ou COMPOSE_PROFILES=code-execution dans .env ; `docker compose
    # build executor` et `up -d executor`, qui le nomment, marchent sans).
    profiles: ["code-execution"]
    restart: unless-stopped
    # PAS de `ports:`, PAS de `volumes:` — volontaire. Ni secret, ni
    # dossier du proxy, ni socket Docker : ce conteneur ne voit rien de
    # l'hôte, et ne garde rien (les bacs vivent en tmpfs, leur système de
    # fichiers est dans l'image).
    networks:
      # Le réseau INTERNE seul (plus bas) : aucune route vers l'extérieur,
      # ni vers searxng, ni vers les autres piles de l'hôte.
      - sandbox
    environment:
      # Le jeton partagé avec le proxy, exigé sur toute l'API. Sans `:?` :
      # absent, le service démarre et REFUSE tout (503, « unhealthy »), il
      # ne tourne jamais ouvert — et compose n'arrête pas les autres
      # services.
      EXECUTOR_TOKEN: "${EXECUTOR_TOKEN:-}"
      # Bornes d'un bac et quotas : défauts de executor/sandbox.py
      # (Limits), à surcharger ici — SANDBOX_<NOM>.
      # SANDBOX_MEMORY: 512m        # mémoire d'un bac (si les cgroups la tiennent)
      # SANDBOX_CPUS: "1.0"         # aussi le nombre de fils des bibliothèques
      # SANDBOX_PIDS: "128"         # processus et fils d'un bac
      # SANDBOX_TIMEOUT: "120"      # délai d'un programme, AU PLUS
      # SANDBOX_IDLE: "1800"        # bac sans appel → détruit (s)
      # SANDBOX_LIFETIME: "14400"   # vie maximale d'un bac (s)
      # SANDBOX_MAX_SESSIONS: "8"   # bacs ouverts, tous clients confondus
      # SANDBOX_MAX_SESSIONS_PER_CLIENT: "4"
      # SANDBOX_WORK_SIZE: 256m     # tmpfs /work d'un bac
      # SANDBOX_TMP_SIZE: 128m      # tmpfs /tmp d'un bac (caches, compilations)
    security_opt:
      # La recette de dev-box (compose.override.example.yaml), trouvée par
      # essais ; sans --privileged ni CAP_SYS_ADMIN. Le prix : l'isolation
      # de CE conteneur est desserrée — une évasion d'un bac vers ce
      # conteneur, puis de ce conteneur vers l'hôte, est plus facile que
      # depuis un conteneur ordinaire. Voir « Exécution de code » dans le
      # README.
      #
      # Le profil seccomp par défaut de Docker refuse clone(CLONE_NEWUSER)
      # sans CAP_SYS_ADMIN : podman s'arrête sur « cannot clone: Operation
      # not permitted ». (Les BACS, eux, reçoivent le profil seccomp de
      # podman.)
      - seccomp=unconfined
      # Docker masque des chemins de /proc et monte /proc/sys en lecture
      # seule ; le noyau refuse alors de monter un /proc neuf dans un
      # espace d'utilisateurs imbriqué : aucun bac ne démarre.
      - systempaths=unconfined
      # Sans effet sur un hôte sans AppArmor ; nécessaire là où il est
      # actif (Debian) : le profil docker-default refuse les `mount` de crun.
      - apparmor=unconfined
      # ET SURTOUT PAS `no-new-privileges` : newuidmap et newgidmap sont
      # setuid, et sans eux podman n'écrit pas la table d'uid de ses bacs.
      # Dans une pile dont les services étendent une base commune qui le
      # pose, ce service ne l'étend PAS (README, « Exécution de code »).
    # PAS de `devices:` : ni /dev/fuse (le magasin de podman est `vfs`, et
    # un bac démarre d'un système de fichiers déplié, sans image — voir
    # executor/Dockerfile), ni /dev/net/tun (un bac n'a pas de réseau).
    tmpfs:
      # L'état d'exécution de podman : vide à chaque démarrage du
      # conteneur, comme après un redémarrage de machine — c'est à cela
      # que podman reconnaît qu'aucun conteneur ne tourne plus.
      - /run/user/10001:mode=700,uid=10001,gid=10001
    # Le FILET. Les limites par bac (mémoire, CPU) ne sont tenues que si
    # podman peut écrire des cgroups ici, ce qui n'est pas acquis dans un
    # conteneur ; l'exécuteur l'essaie au démarrage et le dit (GET
    # /v1/status, journal). Ce plafond-ci, tenu par Docker, vaut dans tous
    # les cas : c'est lui qui protège l'hôte. À RÉGLER sur la machine.
    # Mémoire : les tmpfs des bacs y comptent. Pire cas sans cgroups par
    # bac : 8 bacs × (256 Mo /work + 128 Mo /tmp + 16 Mo /dev/shm) ≈
    # 3,2 Go, plus les programmes en cours. À ajuster avec
    # SANDBOX_MAX_SESSIONS.
    mem_limit: 4g
    # Pas d'échange : un programme qui déborde est tué, il ne fait pas
    # ramer l'hôte.
    memswap_limit: 4g
    cpus: 2
    # 8 bacs × 128 processus (RLIMIT_NPROC, tenu par uid de bac) + conmon,
    # init et `sleep` de chaque bac + le serveur.
    pids_limit: 2048
    # Même forme que celui du proxy. 503 tant que podman n'a pas démarré
    # un conteneur d'essai, ou sans jeton.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  # Entre le proxy et l'exécuteur, et rien d'autre. `internal` : Docker ne
  # lui donne ni passerelle vers l'extérieur ni port publiable — un
  # programme qui s'évaderait d'un bac serait dans un conteneur sans
  # sortie.
  sandbox:
    internal: true

volumes:
  searxng-cache:
