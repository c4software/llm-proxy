services:
  albert-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Config (config.toml) et base de statistiques (stats.db) : le volume
    # les garde au travers des redémarrages et des rebuilds d'image.
    volumes:
      - ./data:/app/data
    environment:
      # Les SECRETS seulement : injectés dans le TOML par «${VAR}»
      # (voir data/config.example.toml). Les réglages vivent dans le TOML.
      ALBERT_API_KEY: "${ALBERT_API_KEY}"
      # CONFIG_PATH: /app/data/config.toml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
