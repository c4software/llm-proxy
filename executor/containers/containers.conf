# Surcharges de l'exécuteur (les valeurs de containers-common sont gardées).
# Même recette que dev-box (rootfs/etc/containers/containers.conf.d/).
[engine]
# Pas de systemd ici (le PID 1 est uvicorn), pas de journald : le cgroup
# est délégué par le point d'entrée (entrypoint.sh) si Docker l'a monté
# en écriture, et ce qui est tenu est VÉRIFIÉ au démarrage
# (sandbox.Sandboxes.probe).
cgroup_manager = "cgroupfs"
# Aucun journal d'événements : personne ne le lit, et il grossirait.
events_logger = "none"
runtime = "crun"

[containers]
# Un bac n'a pas de réseau : rien à régler dans son /proc/sys (le défaut,
# net.ipv4.ping_group_range, est une écriture de moins qui peut échouer).
default_sysctls = []
