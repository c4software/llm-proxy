# Le magasin de podman dans l'exécuteur. storage.conf n'a pas de dossier
# de surcharges : ce fichier remplace celui de containers-common.
#
# `vfs` : le pilote sans aucun prérequis (ni /dev/fuse, ni overlay sur
# overlay). Il COPIE les couches, ce qui le rend inutilisable pour de
# vraies images — mais un bac démarre d'un système de fichiers déplié
# (`podman run --rootfs`, voir Dockerfile), sans image : le magasin ne
# reçoit que la couche VIDE de chaque conteneur. Rien à copier.
# Pour des bacs tirés d'une image (SANDBOX_IMAGE), revenir à la recette de
# dev-box : driver = "overlay", mount_program = "/usr/bin/fuse-overlayfs",
# le paquet fuse-overlayfs, et /dev/fuse dans le compose.
[storage]
driver = "vfs"
