# Le facultatif et le propre à la machine, à part du docker-compose.yml
# versionné :
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# puis ne garder que les blocs voulus. Compose le lit et le fusionne tout
# seul ; il n'est pas versionné. Dans une pile à `include`, nommer les
# deux fichiers :
#
#   include:
#     - path:
#         - ./llm-proxy/docker-compose.yml
#         - ./llm-proxy/docker-compose.override.yml
#
# Vérifier la fusion : `docker compose config`. Détail : docs/deploiement.md
# et docs/execution-de-code.md, « Le compose de base et son override ».

services:

  # ── Bloc 1 : l'exécution de code (outil hébergé `code_execution`) ─────
  # Trois morceaux qui vont ensemble : le proxy sur le réseau `sandbox`,
  # le service `executor`, le réseau `sandbox` en bas. Plus EXECUTOR_TOKEN
  # dans .env, [tools.code_execution] et [files] dans data/config.toml.
  # Mise en route : docs/execution-de-code.md.
  albert-proxy:
    # Un service qui nomme ses réseaux quitte `default` s'il ne le nomme pas.
    networks:
      - default     # searxng, et la sortie vers les backends
      - sandbox     # l'exécuteur de code, et rien d'autre

  # Podman sans root, où tournent les programmes des modèles, chacun dans
  # un bac sans réseau. Pas de `depends_on` : absent, seul l'outil échoue.
  # Sur une nouvelle machine, valider avant d'activer l'outil
  #   docker compose exec executor python -m executor.validate
  # (docs/execution-de-code.md, « Valider l'exécuteur sur le déploiement »).
  executor:
    # Image de la CI (`docker compose pull executor`) ; `build:` pour
    # construire sur place une version modifiée.
    image: ghcr.io/c4software/llm-proxy-executor:latest
    build:
      context: ./services/executor
      # Scripts de dev-box, tirés à chaque construction. Un fork ou une
      # branche : changer l'URL (…/dev-box.git#ma-branche).
      additional_contexts:
        devbox: https://github.com/c4software/dev-box.git#main
    restart: unless-stopped
    # Pas de `ports:` ni de `volumes:`, volontairement : ni secret, ni
    # dossier du proxy, ni socket Docker.
    networks:
      # Réseau interne seul : aucune route vers l'extérieur ni searxng.
      - sandbox
      # Sortie du relais de paquets, seulement avec SANDBOX_EGRESS. Le
      # prix : une évasion d'un bac arriverait dans un conteneur avec sortie.
      # - sandbox-egress
    environment:
      # Sans `:?` : absent, le service démarre et refuse tout (503).
      EXECUTOR_TOKEN: "${EXECUTOR_TOKEN:-}"
      # Bornes et quotas des bacs (défauts : executor/sandbox.py, Limits).
      # SANDBOX_MEMORY: 512m        # mémoire d'un bac (si les cgroups la tiennent)
      # SANDBOX_CPUS: "1.0"         # aussi le nombre de fils des bibliothèques
      # SANDBOX_PIDS: "128"         # processus et fils d'un bac
      # SANDBOX_TIMEOUT: "120"      # délai d'un programme, AU PLUS
      # Purge d'un bac inactif, avec ses fichiers (s, défaut 3 h).
      # SANDBOX_IDLE: "10800"
      # Vie maximale d'un bac, même utilisé sans arrêt (s, défaut 4 h).
      # SANDBOX_LIFETIME: "14400"
      # SANDBOX_MAX_SESSIONS: "8"   # bacs ouverts, tous clients confondus
      # SANDBOX_MAX_SESSIONS_PER_CLIENT: "4"
      # SANDBOX_WORK_SIZE: 256m     # tmpfs /work d'un bac
      # SANDBOX_TMP_SIZE: 128m      # tmpfs /tmp d'un bac (caches, compilations)
      # Fichiers d'entrée : au moins autant que [tools.code_execution]
      # (max_files, max_file_bytes, max_files_bytes).
      # SANDBOX_MAX_INPUTS: "8"
      # SANDBOX_MAX_INPUT_BYTES: "20000000"
      # SANDBOX_MAX_INPUT_TOTAL_BYTES: "40000000"
      #
      # Installer des paquets (pip, npm, cargo, Go) par un relais HTTPS ;
      # avec packages = true côté proxy et le réseau `sandbox-egress`.
      # SANDBOX_EGRESS: "true"
      # SANDBOX_EGRESS_HOSTS: ""    # vide : PyPI, npm, crates.io, modules Go
      # SANDBOX_EGRESS_MAX_BYTES: "500000000"   # par bac, dans les deux sens
      # /tmp compte dans la mémoire du bac : agrandir les deux ensemble.
      # SANDBOX_TMP_SIZE: 768m
      # `devbox dev-env` : tmpfs /opt/devbox compté dans la mémoire, et une
      # installation dure jusqu'à une minute (monter aussi
      # [tools.code_execution].timeout).
      # SANDBOX_DEVBOX_SIZE: 2g
      # SANDBOX_MEMORY: 3g
      # SANDBOX_TIMEOUT: "300"
    security_opt:
      # Ce qu'il faut à podman imbriqué, sans --privileged ni CAP_SYS_ADMIN ;
      # l'isolation de ce conteneur en est desserrée (docs/execution-de-code.md,
      # « Ce que le bac à sable vaut »).
      # seccomp par défaut : refuse clone(CLONE_NEWUSER).
      - seccomp=unconfined
      # /proc masqué : aucun /proc neuf dans un userns imbriqué.
      - systempaths=unconfined
      # Là où AppArmor est actif : docker-default refuse les `mount` de crun.
      - apparmor=unconfined
      # Sans cgroup inscriptible, podman ne borne aucun bac (seul le
      # plafond plus bas tient) ; l'exécuteur le signale (GET /v1/status).
      - writable-cgroups=true
      # Surtout PAS `no-new-privileges` : il neutralise newuidmap et
      # newgidmap. Ne pas faire étendre à ce service une base qui la pose.
    # Pas de `devices:` : ni /dev/fuse (magasin `vfs`), ni /dev/net/tun.
    tmpfs:
      # État de podman, vide à chaque démarrage : aucun conteneur ne tourne.
      - /run/user/10001:mode=700,uid=10001,gid=10001
    # Le filet, tenu par Docker dans tous les cas : c'est lui qui protège
    # l'hôte. À régler sur la machine, avec SANDBOX_MAX_SESSIONS (les tmpfs
    # des bacs comptent : ~3,2 Go pour 8 bacs sans cgroups par bac).
    mem_limit: 4g
    # Pas d'échange : un programme qui déborde est tué.
    memswap_limit: 4g
    cpus: 2
    # 8 bacs × 128 processus, plus conmon, init, sleep et le serveur.
    pids_limit: 2048
    # 503 tant que podman n'a pas démarré un conteneur d'essai, ou sans jeton.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Bloc 1 bis : le rendu des pages en JavaScript (web_fetch render) ──
  # browserless : un Chromium headless servi en REST, que web_fetch et
  # web_grep appellent pour `render: true` (tools/render.py). Avec : le
  # proxy aussi sur le réseau `render` (ajouter `- render` à ses
  # `networks`, Bloc 1), BROWSERLESS_TOKEN (et RENDER_BLOCKED_HOSTS) dans
  # .env, [tools.web_fetch] render_url / render_token dans config.toml.
  # Réseau à lui, SANS les autres conteneurs : le navigateur sort vers
  # Internet, mais ne voit aucun service de la pile par son nom. L'accès au
  # réseau local n'est qu'ATTÉNUÉ (docs/outils.md, « Le rendu des pages »).
  # Image lourde (~2,5 Go), ~400 Mo de RAM par rendu.
  # browserless:
  #   # Tag daté : https://github.com/browserless/browserless/pkgs/container/chromium
  #   image: ghcr.io/browserless/chromium:v2.57.1
  #   restart: unless-stopped
  #   environment:
  #     TOKEN: "${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN dans .env}"
  #     CONCURRENT: "2"       # rendus en parallèle ; les suivants attendent
  #     QUEUED: "4"           # au-delà : 429, rendu à l'outil comme « occupé »
  #     TIMEOUT: "60000"      # vie maximale d'un rendu (ms)
  #   shm_size: 1gb
  #   mem_limit: 2g
  #   cpus: 2
  #   networks:
  #     - render

  # ── Bloc 2 : adapter la pile à la machine ─────────────────────────────
  # Une clé posée ici remplace une valeur simple et s'ajoute à une liste ;
  # `!reset` vide une liste héritée, `!override` la remplace.
  #
  # albert-proxy:
  #   container_name: llm-proxy
  #   # Derrière un reverse proxy du même hôte : plus de port publié.
  #   ports: !reset []
  #   # Un backend joint par un nom que le DNS du conteneur ne connaît pas.
  #   extra_hosts:
  #     - "bigchuck:100.64.0.4"
  #   # Une base commune aux services de l'hôte. PAS pour `executor`.
  #   extends:
  #     file: ../bases-configuration/base.yml
  #     service: base
  #
  # searxng:
  #   container_name: searxng

networks:
  # `internal` : ni passerelle vers l'extérieur ni port publiable.
  sandbox:
    internal: true
  # Sortie du seul relais de paquets (SANDBOX_EGRESS), à part du proxy.
  # sandbox-egress: {}
  # Le proxy et browserless, et rien d'autre (Bloc 1 bis).
  # render: {}
