# Image de l'exécuteur de code (services/executor). La base (Arch `latest`)
# et les scripts de dev-box ne sont pas figés : reconstruction mensuelle.
# Le build lance sandbox/check.py ; la validation de l'isolation
# (python -m executor.validate) se fait sur la machine, elle dépend de son
# noyau et de son Docker.
# Sur la machine :
#   docker compose pull executor && docker compose up -d executor
name: Image de l'exécuteur

on:
  push:
    branches: [master]
    paths:
      - "services/executor/**"
      - ".github/workflows/executor.yml"
  schedule:
    - cron: "17 4 1 * *"          # le 1er du mois : Arch et dev-box ont bougé
  workflow_dispatch:
    inputs:
      devbox:
        description: "Dépôt et branche de dev-box (contexte « devbox »)"
        default: "https://github.com/c4software/dev-box.git#main"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/llm-proxy-executor

concurrency:
  group: executor-image
  cancel-in-progress: true

jobs:
  build:
    name: Construire et publier (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes
        id: tags
        run: |
          {
            echo "date=$(date -u +%Y%m%d)"
            echo "sha=sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: services/executor
          platforms: linux/amd64
          # Sans cache : la reconstruction mensuelle prend les nouveautés.
          pull: true
          no-cache: true
          build-contexts: |
            devbox=${{ inputs.devbox || 'https://github.com/c4software/dev-box.git#main' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.date }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Exécuteur de code de llm-proxy (bacs podman sur la base de dev-box)
            org.opencontainers.image.revision=${{ github.sha }}
