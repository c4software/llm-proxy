# Clients jetables pour valider le proxy, chacun dans son image avec SA
# configuration : rien ne touche ~/.claude, ~/.pi, ~/.codex ni ~/.omp.
# Scénarios et résultats : README.md.
#
#   cp .env.example .env          # PROXY_URL, MODELS…
#   docker compose run --rm claude            # tous les scénarios Claude Code
#   docker compose run --rm pi                # tous les scénarios pi (API OpenAI)
#   docker compose run --rm codex             # tous les scénarios Codex (API Responses)
#   docker compose run --rm omp               # tous les scénarios omp (API OpenAI)
#   docker compose run --rm api               # les requêtes directes (aucun agent)
#   docker compose run --rm claude claude     # Claude Code interactif
#   docker compose run --rm pi pi             # pi interactif
#
# Réseau HÔTE : 127.0.0.1:8000 est le proxy de la racine du dépôt ; un nom
# dans PROXY_URL est résolu par la machine qui lance les conteneurs.
services:
  claude:
    build: ./claude
    network_mode: host
    env_file: .env
    environment:
      ANTHROPIC_BASE_URL: "${PROXY_URL}"
      ANTHROPIC_API_KEY: "${PROXY_API_KEY}"
      ANTHROPIC_SMALL_FAST_MODEL: "${SMALL_MODEL}"
    command: ["./scenarios.sh"]

  pi:
    build: ./pi
    network_mode: host
    env_file: .env
    command: ["./scenarios.sh"]

  codex:
    build: ./codex
    network_mode: host
    env_file: .env
    command: ["./scenarios.sh"]

  # LLM_PROXY_URL et LLM_PROXY_API_KEY : dérivées par omp/entrypoint.sh.
  omp:
    build: ./omp
    network_mode: host
    env_file: .env
    command: ["./scenarios.sh"]

  api:
    build: ./api
    network_mode: host
    env_file: .env
    command: ["python3", "scenarios.py"]
