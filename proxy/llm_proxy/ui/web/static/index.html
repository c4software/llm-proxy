<!doctype html>
<!--
  L'entrée de la page, pour Vite : la tête du document et #app, où main.js
  monte l'application (App.vue). Construite dans web/dist/ (proxy/wasm,
  npm run build) ; le proxy sert dist/index.html sous /ui.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Sans viewport-fit=cover : Chrome Android dessinerait alors la page sous
     la barre de gestes sans en dire la hauteur. resizes-content : le clavier
     réduit la page, la zone de saisie du chat reste au-dessus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>llm-proxy</title>
<!-- Installable : manifeste, icônes, couleur de barre ; service worker /ui/sw.js. -->
<link rel="manifest" href="/ui/static/manifest.webmanifest">
<link rel="icon" href="/ui/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ui/static/icon-192.png">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="llm-proxy">
<link rel="stylesheet" href="./dashboard.css">
<!-- Thème posé AVANT le premier rendu : pas d'éclair de l'autre thème. -->
<script>try { const t = localStorage.getItem("llm-proxy-theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<script type="module" src="./main.js"></script>
</head>
<body>
<!-- Avant Vue (scripts en cours de chargement) : visible tant que #app
     n'est pas monté (le montage retire v-cloak). -->
<div class="boot" role="status"><span class="spinner" aria-hidden="true"></span> Chargement…</div>
<div id="app" v-cloak>
</div>
</body>
</html>
