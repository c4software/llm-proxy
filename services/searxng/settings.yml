# SearXNG de l'outil `web_search`. Ne porte que ce qui diffère des
# défauts (use_default_settings) ou ce dont le compose dépend ; un
# dictionnaire est fusionné clé par clé, une liste remplacée en entier.
# Référence : https://docs.searxng.org/admin/settings/
#
# Pas de clé secrète ici : SEARXNG_SECRET, dans .env.
use_default_settings: true

search:
  # Le proxy demande format=json (403 sinon) ; `html` reste pour
  # diagnostiquer un moteur depuis l'interface.
  formats:
    - html
    - json

server:
  # Déjà les défauts, écrits parce que le compose en dépend. Le limiteur
  # exige Valkey et prendrait le proxy pour un robot ; l'instance est
  # protégée par l'absence de port publié.
  limiter: false
  public_instance: false

# Moteurs en plus des trois par défaut (brave, duckduckgo, google cse),
# qui peuvent bloquer l'instance ensemble (débit, CAPTCHA) : il en reste
# quand certains bloquent. Cette liste-ci complète les défauts, moteur par
# moteur.
engines:
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: yep
    disabled: false
  - name: mwmbl
    disabled: false
