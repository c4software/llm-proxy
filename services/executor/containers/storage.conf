# Remplace celui de containers-common (pas de dossier de surcharges).
#
# `vfs` : sans prérequis (ni /dev/fuse, ni overlay sur overlay). Il copie
# les couches, mais un bac démarre de `--rootfs`, sans image : rien à
# copier. Pour des bacs tirés d'une image (SANDBOX_IMAGE) : driver =
# "overlay", mount_program = "/usr/bin/fuse-overlayfs", le paquet
# fuse-overlayfs, et /dev/fuse dans le compose.
[storage]
driver = "vfs"
