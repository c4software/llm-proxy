# Surcharges de l'exécuteur, sur les valeurs de containers-common.
[engine]
# Ni systemd ni journald : le cgroup est délégué par entrypoint.sh, et
# vérifié au démarrage (sandbox.Sandboxes.probe).
cgroup_manager = "cgroupfs"
# Personne ne lit le journal d'événements, et il grossirait.
events_logger = "none"
runtime = "crun"

[containers]
# Un bac n'a pas de réseau : le défaut (net.ipv4.ping_group_range) ne
# serait qu'une écriture de plus qui peut échouer.
default_sysctls = []
