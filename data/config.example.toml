# ════════════════════════════════════════════════════════════════════════
#  llm-proxy — configuration unique
#
#  Copié en data/config.toml au premier démarrage s'il n'existe pas.
#  Emplacement : variable CONFIG_PATH (défaut data/config.toml ; /app/data
#  dans l'image). Toute chaîne peut contenir «${VARIABLE}», lue dans
#  l'environnement : les CLÉS D'API passent par là, jamais en clair ici.
#  Chemins relatifs (bases SQLite…) = à côté de ce fichier.
#  Référence complète : docs/configuration.md.
# ════════════════════════════════════════════════════════════════════════

[proxy]
# Valeur injectée dans `tool_choice` par un backend force_tool_choice = true.
tool_choice = "auto"
# Timeout (s) des appels aux backends.
upstream_timeout = 600
# Timeout (s) des méta-données (/v1/models, /v1/me/info) : court, un backend
# lent ne bloque pas le catalogue.
meta_timeout = 5
# Durée (s) pendant laquelle le catalogue d'un backend est gardé, réponse
# comme silence (un backend éteint ne fait pas attendre chaque appel).
catalog_ttl = 30
log_level = "INFO"

# Clé(s) exigée(s) des clients («Authorization: Bearer <clé>»).
# LISTE VIDE = PROXY OUVERT à quiconque le joint. /healthz reste sans clé.
api_keys = []
# api_keys = ["${PROXY_API_KEY}"]

# Routes POST relayées telles quelles, en plus des handlers dédiés
# (/v1/chat/completions, /v1/models…). Toute autre URL → 404 local.
forward_post_paths = [
  "/v1/completions", "/v1/embeddings", "/v1/rerank",
  "/v1/audio/transcriptions", "/v1/audio/speech",
  "/v1/images/generations", "/v1/images/edits", "/v1/ocr",
]
# Suffixes jamais temporisés par le limiteur Albert (hors quota chat) ni
# comptés au partage équitable.
exempt_paths = ["/embeddings", "/rerank", "/audio/transcriptions", "/ocr"]


# ── Surface Anthropic : POST /v1/messages ───────────────────────────────
# Voir docs/api-anthropic.md. Traduit l'API Messages vers
# /v1/chat/completions du backend désigné par le préfixe du modèle.
# Table absente ou enabled = false (défaut) → 404.
[anthropic]
enabled = true
# En flux, pendant l'attente du limiteur : un `event: ping` toutes les N s
# (un client coupe un flux muet). 0 = attendre avant de répondre.
ping_interval = 10
# `reasoning_content` du backend → bloc `thinking`. false = jeté.
reasoning_as_thinking = true
# Une ligne de log par réponse (stop_reason, outils appelés, tokens).
trace = false

# Nom de modèle reçu → nom PRÉFIXÉ du proxy. Claude Code envoie des noms
# Claude en dur pour ses tâches de fond : sans entrée, 400. Un suffixe
# «[1m]» est ignoré ; un nom déjà préfixé passe tel quel ; «default»
# attrape tout nom inconnu (sans lui → 400).
[anthropic.model_map]
default = "albert/deepseek-v4-flash"
"claude-fable-5" = "albert/deepseek-v4-flash"
"claude-mythos-5" = "albert/deepseek-v4-flash"
"claude-opus-5" = "albert/deepseek-v4-flash"
"claude-opus-4-8" = "albert/deepseek-v4-flash"
"claude-opus-4-7" = "albert/deepseek-v4-flash"
"claude-opus-4-6" = "albert/deepseek-v4-flash"
"claude-opus-4-5" = "albert/deepseek-v4-flash"
"claude-sonnet-5" = "albert/deepseek-v4-flash"
"claude-sonnet-4-6" = "albert/deepseek-v4-flash"
"claude-sonnet-4-5" = "albert/deepseek-v4-flash"
"claude-haiku-4-5" = "albert/deepseek-v4-flash"
# Alias génériques.
"opus" = "albert/deepseek-v4-flash"
"sonnet" = "albert/deepseek-v4-flash"
"haiku" = "albert/deepseek-v4-flash"


# ── Surface Responses : POST /v1/responses ──────────────────────────────
# Voir docs/api-responses.md. Traduit vers /v1/chat/completions ; aucun
# état côté proxy (previous_response_id → 400). Outils propres à OpenAI
# ignorés, sauf `web_search` exécuté par le proxy ([tools]).
# Table absente ou enabled = false (défaut) → 404.
[responses]
enabled = true
# `reasoning_content` du backend → élément `reasoning`. false = jeté.
reasoning_as_summary = true


# ── Outils hébergés sur /v1/chat/completions ────────────────────────────
# Voir docs/outils-heberges.md et docs/chat.md.
[chat]
# true : une déclaration d'outil hébergé dans `tools` ({"type": "web_search"},
# `web_search_options`…) est remplacée par les fonctions de [tools] et le
# proxy boucle lui-même ; le client reçoit une réponse ordinaire. Un outil
# déclaré mais désactivé → 400. false (défaut) : relais brut.
hosted_tools = true
# Outils présentés D'OFFICE à TOUTE requête de cette route (interface de
# chat), ex. ["web_search", "web_fetch", "mcp:deepwiki"] ; «mcp:<serveur>»
# = tous ses outils. Vide = rien (défaut). Nom inconnu ou outil désactivé :
# ignoré avec avertissement. Pour un agent, préférer [mcp_server] (les
# deux ensemble présentent chaque outil deux fois).
# ATTENTION : vaut pour tous les clients et modèles (sauf always_except) ;
# le texte des pages web entre alors dans toutes les conversations
# (injection de prompt, voir [tools]).
always = []
# Modèles exclus d'`always` : jokers shell sur «<backend>/<modèle>», casse
# ignorée (ex. le modèle de tâches d'une interface).
# always_except = ["bigchuck/qwen3.8-nano*"]
always_except = []
# Annotations `url_citation` en fin de réponse. false = aucune.
annotations = true
# Mémoire des échanges cachés : appels hébergés et résultats réinsérés à la
# requête suivante si le client renvoie l'historique inchangé (en mémoire
# vive, cloisonnée par clé ; taille et durée : [tools].cache_entries,
# cache_ttl). false = le modèle perd ce qu'il a lu d'un tour à l'autre.
memory = true
# Caractères gardés au plus, toutes entrées confondues (LRU).
memory_chars = 8000000


# ── Outils hébergés (communs) ───────────────────────────────────────────
# Voir docs/outils-heberges.md. Exécutés par le proxy pour les surfaces
# Responses et Anthropic (outils serveur web_search / web_fetch) et pour
# /v1/chat/completions ([chat]). Rien n'est ajouté à une requête qui ne
# déclare pas l'outil (sauf [chat].always).
#
# ATTENTION : le texte d'une page web entre dans le contexte d'un agent qui
# peut exécuter des commandes chez le client. Une page peut porter des
# instructions (injection de prompt) : AUCUN réglage ici ne l'empêche.
[tools]
# Appels d'outils exécutés pour UNE réponse ; au-delà le modèle doit
# conclure. Le `max_uses` Anthropic peut l'abaisser, pas le relever.
max_calls = 8
# Délai (s) d'une exécution d'outil, tout compris (sauf outils qui ont le
# leur, ci-dessous). Dépassé → erreur rendue au modèle.
run_timeout = 60
# Caractères d'un résultat rendu au modèle ; le surplus est coupé.
max_result_chars = 24000
# Mémoire des résultats (Responses et [chat].memory) : nombre d'appels
# gardés (LRU) et durée de vie (s). En mémoire vive, cloisonnée par clé
# (ou par compte avec [oidc]) ; vidée au redémarrage.
cache_entries = 512
cache_ttl = 86400
# Cache WEB partagé : page lue ou recherche faite, gardée N s (0 = aucun ;
# court, une page d'actualité vieillit). Succès seulement, en mémoire vive.
web_cache_ttl = 600
web_cache_entries = 256
web_cache_bytes = 64000000

# Recherche web par une instance SearXNG (service `searxng` du compose).
[tools.web_search]
enabled = true
# Base de l'instance (appel <url>/search?format=json). Hors compose, mettre
# l'adresse réelle ; vide → outil non configuré. Adresse de configuration :
# [tools.net] ne s'y applique pas. SearXNG doit lister `json` dans
# search.formats (services/searxng/settings.yml), sinon 403.
searxng_url = "http://searxng:8080"
# Délai (s) de la requête à SearXNG.
timeout = 20
# Résultats par défaut (le modèle peut en demander jusqu'à 20).
limit = 8
# `language` («fr», «en-US») et `categories` («general,it») passés à
# SearXNG ; vides = défauts de l'instance.
language = ""
categories = ""

# Lecture d'une page par son URL (HTML → texte, JSON, texte, PDF avec
# couche texte). Présentée avec web_search ; côté Anthropic seulement si
# l'outil serveur web_fetch est déclaré.
[tools.web_fetch]
enabled = true
# Délai (s) par requête (5 redirections au plus).
timeout = 20
# Octets lus au plus sur une page ; le reste n'est pas téléchargé.
max_bytes = 2000000
# Même borne pour un PDF (refusé au-delà : un PDF coupé ne se lit pas).
pdf_max_bytes = 20000000
# Caractères rendus par appel ; la suite se demande par `offset`.
max_chars = 20000

# Recherche d'une regex dans une page (lue par web_fetch, même cache) : rend
# les lignes trouvées et leur offset. Absente de /v1/messages.
[tools.web_grep]
enabled = true
# Lignes rendues par défaut (le modèle peut en demander 50 au plus), et
# lignes de contexte de chaque côté (5 au plus).
max_matches = 20
context = 1
# Délai (s) de la recherche du motif (une regex catastrophique est coupée).
regex_timeout = 1.0

# Garde-fou de TÉLÉCHARGEMENT, commun à tout ce que le proxy va chercher à
# la demande du modèle (web_fetch, OCR, transcription, fichiers du bac…).
# Voir docs/securite.md. (Ces clés sont encore lues dans [tools.web_fetch],
# avec un avertissement, si cette table ne les pose pas.)
[tools.net]
# false (défaut) : adresses PUBLIQUES seulement, vérifiées à chaque
# redirection (ni privées, ni locales, ni CGNAT/Tailscale…).
# true : le modèle peut faire lire au proxy tout service de son réseau
# (backend, routeur, métadonnées cloud) — seulement si tous les clients
# sont de confiance, jamais derrière un modèle qui lit le web.
allow_private = false
# Domaines (sous-domaines et chemin compris) : `allowed_domains` non vide =
# SEULS ceux-là ; `blocked_domains` = jamais. Vides = tout domaine public.
# Seule parade à la fuite de la conversation par une URL.
# allowed_domains = ["github.com", "docs.python.org", "wikipedia.org"]
# blocked_domains = ["pastebin.com"]
# Provenance des URL lues à la demande du modèle (web_fetch, web_grep, ocr,
# transcribe) : "site" (défaut) = seulement un site déjà apparu dans la
# conversation (messages, prompt système, résultats d'outils réussis, une
# recherche comprise) ; une adresse inventée sur un site jamais vu est
# refusée. Là où le proxy voit la conversation (pas /v1/tools ni /mcp).
# "off" = pas de contrôle. Voir docs/outils.md.
provenance = "site"
# User-Agent de tout ce que le proxy télécharge pour un outil (web_fetch,
# web_grep, ocr, transcribe, fichiers de code_execution et image_generation).
# Vide (défaut) : celui de chaque outil, « llm-proxy <outil> (+URL du projet) ».
# user_agent = ""
# URL refusées, quel que soit leur domaine : expressions régulières sur l'URL
# entière (insensibles à la casse), avec un message rendu au modèle. Vérifiées
# à chaque redirection, pour tout outil qui télécharge (web_fetch, web_grep,
# ocr, transcribe). Une chaîne seule vaut une expression sans message.
# Ici : l'hôte de stockage qu'un modèle Qwen (3.8 Flash Next) appelle de
# mémoire, en parallèle d'appels utiles — toujours 403. Refusé avant toute
# requête, avec un message qui arrête ses réessais.
blocked_urls = [
  { pattern = '^https?://routify[^/]*file[^/]*\.aliyuncs\.(com|io)(:\d+)?/', message = "This URL is a dead file-proxy artifact (an address memorized during training, not a real resource). Do NOT retry it or any similar URL; use the URLs from the conversation or from search results." },
]

# OCR d'une image (PNG, JPEG, GIF, WebP) ou d'un PDF scanné, par URL, lu par
# un MODÈLE DE VISION d'un backend. Sur /v1/chat/completions ({"type":
# "ocr"} ou [chat].always) et POST /v1/tools/ocr. Le texte lu entre dans le
# contexte comme une page web (injection possible).
[tools.ocr]
enabled = false
# Modèle de vision PRÉFIXÉ ; son backend doit avoir `images = true`. Vide
# ou invalide → outil non configuré (raison dans le journal).
model = ""
# Délai (s) d'une exécution ; remplace [tools].run_timeout pour cet outil.
timeout = 50
# Octets téléchargés au plus (refusé au-delà).
max_bytes = 20000000
# Octets d'UNE image envoyée au modèle (jamais redimensionnée).
max_image_bytes = 5000000
# Pages de PDF par appel (une requête chacune), et lues en parallèle.
max_pages = 4
concurrency = 2
# Caractères rendus par appel.
max_chars = 20000
# `max_tokens` par page, ramené à [backends.<nom>].max_tokens s'il est plus bas.
max_tokens = 4096

# Transcription d'un fichier audio par URL, via /v1/audio/transcriptions
# d'un backend. Sur /v1/chat/completions ({"type": "transcribe"} ou
# [chat].always) et POST /v1/tools/transcribe.
[tools.transcribe]
enabled = false
# Modèle PRÉFIXÉ "<backend>/<modèle>" ; vide ou invalide → non configuré.
model = ""
# model = "bigchuck/qwen3-asr-1.7b"
# Formats que le modèle lit tels quels parmi mp3, wav, flac, ogg, m4a, aac,
# webm, amr, mp4 (absent = tous).
# formats = ["wav"]
# Les autres sont convertis en WAV 16 kHz mono par ffmpeg ("wav" doit être
# dans `formats`). ffmpeg décode des octets venus du web, borné mais NON
# isolé du proxy : false = refuser plutôt que convertir.
convert = true
# Binaire ffmpeg (nom dans PATH ou chemin).
# ffmpeg = "ffmpeg"
# Délai (s) d'une conversion, et octets du WAV produit (1,92 Mo/min ;
# refusé au-delà).
convert_timeout = 60
convert_max_bytes = 100000000
# "verbose_json" (langue et durée en plus) ou "json" si le backend refuse.
response_format = "verbose_json"
# Délais (s) de la transcription et du téléchargement ; leur somme (+
# convert_timeout) remplace [tools].run_timeout pour cet outil.
timeout = 300
download_timeout = 60
# Octets téléchargés au plus (refusé, pas coupé ; 25 Mo ≈ 25 min de MP3).
max_bytes = 25000000
# Caractères rendus par appel ; la suite par `offset`.
max_chars = 20000
# Langue ISO 639-1 par défaut ("fr") ; vide = détectée.
language = ""
# Cache des transcriptions (texte seul) : durée (s, 0 = aucun) et entrées.
cache_ttl = 3600
cache_entries = 64

# Serveurs MCP distants (HTTP « Streamable » seulement, pas de stdio) dont
# les outils deviennent des outils hébergés `<serveur>_<outil>`. Sur
# /v1/chat/completions ({"type": "mcp"}, "mcp:<serveur>", "<serveur>_<outil>"
# ou [chat].always) et /v1/tools ; pas sur Responses ni Messages. Seuls les
# serveurs listés ici sont joints. Voir docs/outils-heberges.md.
#
# ATTENTION : un outil exposé l'est à TOUS les clients, avec le compte des
# en-têtes ci-dessous, sans confirmation (filtrer ce qui écrit ou supprime
# par `tools` / `exclude`). Descriptions et résultats sont du texte tiers
# (injection de prompt) : serveurs de confiance seulement. Pas d'OAuth.
#
# Réglages communs (ces noms ne peuvent pas être des noms de serveur) :
# [tools.mcp]
# Délai (s) d'un appel et d'une découverte ; remplace [tools].run_timeout.
# timeout = 30
# Période (s) entre deux `tools/list` (0 = au démarrage seulement).
# refresh = 300
# Attente (s) au démarrage de la première découverte (non bloquante).
# startup_wait = 5
# Outils exposés par serveur, au plus.
# max_tools = 64
# Description coupée au-delà ; outil écarté si son schéma est plus gros.
# description_chars = 1024
# schema_chars = 8000
# Octets lus au plus sur une réponse.
# max_bytes = 4000000
#
# Un serveur (nom : lettres, chiffres, «_», «-») :
# [tools.mcp.docs]
# enabled = true
# Adresse de configuration ([tools.net] ne s'y applique pas) ; redirections
# non suivies.
# url = "http://mcp-docs:8000/mcp"
# En-têtes statiques ; variable absente → en-tête non envoyé.
# headers = { Authorization = "Bearer ${MCP_DOCS_TOKEN}" }
# Filtre par nom chez le serveur (jokers) : `tools` = seuls ceux-là,
# `exclude` = jamais ceux-là.
# tools = ["search", "get_*"]
# exclude = ["delete_*"]
# Préfixe des fonctions (défaut : nom de la table ; "" = aucun).
# prefix = "docs"
# Surcharges des réglages communs :
# timeout = 30
# refresh = 300
# max_tools = 64
# verify_ssl = true


# Exécution de code dans un BAC À SABLE, par le service `executor`
# (services/executor/, activé par docker-compose.override.yml). Langages :
# python, bash, javascript, c, cpp, go, rust. Un bac par conversation
# (fichiers gardés, expiration côté exécuteur) ; sans [chat].memory, un bac
# par requête. Sur /v1/chat/completions ({"type": "code_execution"} ou
# [chat].always) et POST /v1/tools/code_execution.
# Voir docs/execution-de-code.md.
#
# ATTENTION : du code écrit par un modèle — donc par n'importe quelle page
# web lue, via injection — tourne sur CETTE machine. Le bac partage le noyau
# de l'hôte ; l'exécuteur tourne sans seccomp ni AppArmor, et ses limites
# (mémoire, CPU, processus) ne tiennent que si son cgroup est délégué.
# Dérouler `docker compose exec executor python -m executor.validate`
# avant d'activer. Exécuteur absent → l'outil rend `unavailable`.
[tools.code_execution]
enabled = false
# Base de l'exécuteur (appel <url>/v1/execute) ; vide → non configuré.
url = "http://executor:8080"
# Jeton partagé (EXECUTOR_TOKEN dans .env) ; vide → non configuré.
token = "${EXECUTOR_TOKEN}"
# Délai (s) d'un programme, compilation comprise ; l'outil y ajoute 120 s et
# remplace [tools].run_timeout. L'exécuteur plafonne (SANDBOX_TIMEOUT).
timeout = 30
# Exécutions par réponse, comptées à part de [tools].max_calls.
max_calls = 8
# Dit au modèle s'il peut installer des paquets ; à accorder avec
# SANDBOX_EGRESS côté exécuteur. false = ni réseau ni installation.
packages = false
# Caractères de sortie rendus (début et fin gardés).
max_output_chars = 12000
# Fichiers d'entrée par appel (URL téléchargées sous [tools.net]) : nombre,
# taille de chacun, total (octets). Refusés au-delà, jamais coupés.
# 0 fichier = paramètre non proposé. L'exécuteur a ses propres bornes
# (SANDBOX_MAX_INPUT*) : les monter aussi.
max_files = 8
max_file_bytes = 20000000
max_files_bytes = 40000000
# Délai (s) de tous les téléchargements d'un appel.
download_timeout = 60
# Autres bornes (mémoire, CPU, /work, fichiers rendus) : variables
# SANDBOX_* du service `executor`.

# Génération d'image via /v1/images/generations d'un backend ; l'image est
# remise comme fichier ([files]) par un lien que le proxy écrit. Exige
# [files].public_url. Sur /v1/chat/completions ({"type":
# "image_generation"} ou [chat].always) et POST /v1/tools/image_generation.
[tools.image_generation]
enabled = false
# Modèle PRÉFIXÉ "<backend>/<modèle>" ; vide ou invalide → non configuré.
# Une `url` rendue par le backend hors de son origine passe par [tools.net].
model = ""
# model = "bigchuck/Qwen-Image-2.1-heretic"
# Tailles proposées au modèle, et celle par défaut (doit être dans la liste).
sizes = ["512x512", "768x768", "1024x1024"]
size = "512x512"
# Délai (s) de la génération, et d'un téléchargement ; timeout + 2 ×
# download_timeout remplace [tools].run_timeout pour cet outil.
timeout = 300
download_timeout = 30
# Images par réponse, comptées à part de [tools].max_calls.
max_calls = 2
# Octets de l'image remise au plus ([files].max_file_bytes vaut aussi).
max_bytes = 10000000
# Retouche d'une image par URL publique via /v1/images/edits. false
# (défaut) : à n'ouvrir que si le modèle sert cette route (non testée
# contre un vrai backend). max_input_bytes : taille de l'image d'entrée.
edits = false
max_input_bytes = 10000000

# Mémoire PERSISTANTE du modèle : fichiers texte sous /memories (outil
# `memory` façon Anthropic), visibles et modifiables dans /ui. Sur /v1/tools,
# [mcp_server] et /v1/chat/completions ({"type": "memory"} ou [chat].always).
# Cloisonnée par clé (condensé sous client.secret ; changer de clé = changer
# de mémoire), par compte avec [oidc] ; proxy ouvert = une mémoire commune.
# ATTENTION : une page lue peut y faire écrire une consigne qui suivra le
# modèle (injection persistante) : la relire de temps en temps.
[tools.memory]
enabled = false
database = "memory.db"
# Bornes par clé : fichiers, caractères d'un fichier, caractères en tout.
max_files = 500
max_file_chars = 100000
max_total_chars = 2000000


# ── Serveur MCP : POST /mcp ─────────────────────────────────────────────
# Offre les outils hébergés actifs (ceux de GET /v1/tools) à tout client
# MCP, avec la clé du proxy. Inverse de [tools.mcp]. Un client qui les
# reçoit déjà par [chat].always les aurait deux fois. Voir docs/outils.md.
[mcp_server]
enabled = false
# Origines navigateur admises en plus de celle du proxy ; autre → 403.
allowed_origins = []


# ── Tableau de bord (/ui) ───────────────────────────────────────────────
# Voir docs/tableau-de-bord.md et docs/chat.md.
[ui]
# Onglet Chat : DÉPENSE des tokens au nom de la clé (ou du compte)
# connectée. false (défaut) = POST /ui/chat/completions → 404.
chat = false
# Modèle présélectionné (<backend>/<modèle>) ; vide = dernier choisi, sinon
# premier du catalogue.
chat_model = ""
# Historique des conversations du compte (jamais les incognito).
conversations_database = "conversations.db"
# Outils de la PAGE (exécutés par le navigateur) refusés à TOUS les comptes :
# des familles (« camera », « screen », « location », « clipboard », « sql »,
# « php », « compute »…) ou des outils (« run_php »). Ni au menu Outils, ni
# présentés au modèle ; le proxy les retire aussi de toute requête du chat
# de la page. Liste des familles et de leurs outils : ui/page_tools.json
# (tiré du registre de la page). Voir docs/navigateur.md.
# page_tools_disabled = ["camera", "screen"]
# Bornes (octets) : une conversation, une image, l'historique d'un compte.
conversation_max_bytes = 20000000
asset_max_bytes = 20000000
history_max_bytes = 2000000000


# ── Partage équitable ───────────────────────────────────────────────────
# Pas un quota (jamais de 429) : au-delà de sa part de tokens sur une heure
# glissante, un client ATTEND. Client = compte, sinon clé du TOML ; proxy
# ouvert = personne n'est compté. Part par compte réglable dans la page.
# Hors partage : [proxy].exempt_paths et backends `fair_share = false`.
[fair_share]
# Part par défaut, tokens/heure. 0 = illimitée.
tokens_per_hour = 0


# ── Comptes : connexion par OIDC ────────────────────────────────────────
# Voir docs/securite.md et docs/tableau-de-bord.md. Sans `issuer` ni
# `client_id` : pas de comptes, la page s'ouvre avec une clé de
# [proxy].api_keys. Avec : /ui ne s'ouvre QUE par le fournisseur ; chaque
# compte crée ses clés ; le PREMIER compte connecté est admin.
# Chez le fournisseur : client confidentiel, flux authorization code,
# retour <adresse publique>/ui/auth/callback.
[oidc]
issuer = ""
client_id = "${OIDC_CLIENT_ID}"
client_secret = "${OIDC_CLIENT_SECRET}"
# scopes = ["openid", "email", "profile"]
# Vide : [files].public_url + /ui/auth/callback, sinon déduite de la requête
# (derrière un reverse proxy, poser l'une ou l'autre).
# redirect_uri = "https://llm.example.org/ui/auth/callback"
# Nouveau compte : «pending» = attend un admin ; «user» = actif d'emblée.
new_accounts = "pending"
# Durée d'une session (jours).
session_days = 7
# Clés actives au plus par compte.
max_keys_per_account = 50
database = "accounts.db"
# Libellé du bouton de connexion.
label = "Se connecter"


# ── Fichiers rendus par les outils ──────────────────────────────────────
# Servis par GET <public_url>/v1/files/<jeton>/<nom>, HORS clé du proxy :
# qui a le lien a le fichier jusqu'à expiration. En mémoire vive (perdus
# au redémarrage).
[files]
# Adresse publique du proxy vue du navigateur, sans «/» final. Vide = aucun
# fichier remis (le modèle en est prévenu).
public_url = ""
# Durée de vie (s) d'un fichier, et d'un fichier de conversation incognito.
ttl = 14400
incognito_ttl = 900
# Octets gardés au plus en tout (les plus anciens sortent), et par fichier.
max_bytes = 128000000
max_file_bytes = 10000000


# ── Statistiques ────────────────────────────────────────────────────────
# Voir docs/statistiques.md.
[stats]
# Une ligne par requête et par exécution d'outil (mesures seulement).
database = "stats.db"
# Purge au-delà de N jours (0 = jamais).
retention_days = 90


# ── Quotas Albert ───────────────────────────────────────────────────────
[quotas]
# Marge appliquée aux limites du compte (0.9 = 90 %).
margin = 0.9
# Rafraîchissement (s) des limites via GET /v1/me/info.
limits_refresh = 3600
# Attente au-delà de N s (quota journalier épuisé) → 429 local avec
# Retry-After plutôt que de bloquer.
max_queue_seconds = 900
# Limites des modèles inconnus de /v1/me/info et de family_limits.
generic_rpm = 30
generic_tpm = 128000
# Ligne d'état dans les logs, au plus toutes les N s (0 = désactivé).
status_interval = 600

# Routeur → préfixes de modèles, prioritaire sur la détection automatique
# (si les logs signalent une famille non associée).
# [quotas.router_models]
# 3 = ["openweight-code", "qwen"]

# Limites par famille, pour les modèles absents de /v1/me/info (ou s'il est
# injoignable). `models` = préfixes du nom de modèle (le plus long gagne).
[quotas.family_limits.deepseek]
rpm = 50
tpm = 246000
models = ["deepseek"]

[quotas.family_limits.mistral]
rpm = 50
tpm = 128000
models = ["openweight-small", "openweight-medium", "mistral", "ministral"]

[quotas.family_limits.qwen]
rpm = 50
tpm = 128000
models = ["openweight-code", "qwen"]

[quotas.family_limits.gptoss]
rpm = 10
tpm = 128000
models = ["openweight-large", "gpt-oss"]


# ── Backends ────────────────────────────────────────────────────────────
# Le NOM de la table est le PRÉFIXE de routage («albert/…» → [backends.albert],
# préfixe retiré avant transfert). Modèle sans préfixe connu → 400.
#
# Champs :
#   url (requis), api_key, verify_ssl (true), timeout, meta_timeout ;
#   quotas — limiteur Albert (false) ;
#   connect_timeout — s, poignée de main TCP (15 avec quotas, 1 sinon :
#     un backend local éteint → 503 backend_offline vite) ;
#   force_tool_choice — `tool_choice` injecté si `tools` sans lui : absent/
#     false = rien (défaut), true = [proxy].tool_choice, ou une valeur
#     ("auto"…). Seul Albert en a besoin (son défaut «none» casse les outils) ;
#   max_tokens — plafond de la valeur du client (0/absent = aucun) ;
#   images — transmet les images aux modèles multimodaux du catalogue
#     (false : remplacées par un texte) ;
#   tokenize_path — count_tokens exact (llama.cpp : "/tokenize") ; absent =
#     estimation à 4 caractères/token ;
#   fair_share — compté au partage équitable (true) ;
#   model_types — type imposé par motif (jokers, casse ignorée) quand le
#     catalogue ou le nom du modèle trompe :
#   [backends.bigchuck.model_types]
#   "mon-modele-voice-chat" = "text-generation"
#   "*-vision-*" = "image-text-to-text"

[backends.albert]
url = "https://albert.api.etalab.gouv.fr"
api_key = "${ALBERT_API_KEY}"
quotas = true
force_tool_choice = "auto"
# max_tokens = 8192

# Backend local llama.cpp : sans quota, contacté à la demande seulement.
[backends.bigchuck]
url = "http://bigchuck:8009"
# images = true
# tokenize_path = "/tokenize"
