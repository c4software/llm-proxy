# ════════════════════════════════════════════════════════════════════════
#  llm-proxy — configuration unique
#
#  Copié en data/config.toml au premier démarrage s'il n'existe pas.
#  Toute chaîne peut contenir «${VARIABLE}» : la valeur est prise dans
#  l'environnement au chargement. Les CLÉS D'API passent par là et ne
#  sont donc jamais écrites dans ce fichier.
#
#  Emplacement surchargeable par la variable d'environnement CONFIG_PATH.
# ════════════════════════════════════════════════════════════════════════

[proxy]
# Valeur injectée dans `tool_choice` quand un backend demande
# force_tool_choice = true (voir [backends]).
tool_choice = "auto"
# Timeout (s) par défaut des appels vers les backends.
upstream_timeout = 600
# Timeout (s) des appels de méta-données (GET /v1/models, /v1/me/info…) :
# court, un backend lent ne doit pas bloquer le catalogue.
meta_timeout = 5
log_level = "INFO"

# Clé(s) exigée(s) DES CLIENTS pour appeler le proxy («Authorization:
# Bearer <clé>»). Liste vide = proxy ouvert. /healthz reste toujours
# accessible sans clé.
api_keys = []
# api_keys = ["${PROXY_API_KEY}"]

# Seules routes POST relayées aux backends, en plus des handlers dédiés
# (/v1/chat/completions, /v1/models). Toute autre URL → 404 local.
forward_post_paths = [
  "/v1/completions", "/v1/embeddings", "/v1/rerank",
  "/v1/audio/transcriptions", "/v1/audio/speech",
  "/v1/images/generations", "/v1/images/edits", "/v1/ocr",
]
# Endpoints hors quota chat côté Albert : jamais temporisés.
exempt_paths = ["/embeddings", "/rerank", "/audio/transcriptions", "/ocr"]


# ── Surface Anthropic (Claude Code) ─────────────────────────────────────
# Un client écrit pour l'API Messages d'Anthropic — Claude Code — peut
# parler au proxy comme s'il était api.anthropic.com :
#
#   ANTHROPIC_BASE_URL=http://localhost:8000
#   ANTHROPIC_API_KEY=<clé du proxy, ou n'importe quoi si proxy ouvert>
#   ANTHROPIC_MODEL=albert/deepseek-v4-flash
#
# Le proxy traduit /v1/messages en /v1/chat/completions (et la réponse,
# flux SSE compris) vers le backend que désigne le préfixe, comme pour
# tout autre client. Uniquement dans ce sens : aucun backend Anthropic.
# L'outil WebSearch de Claude Code passe par l'outil serveur `web_search`
# d'Anthropic : le proxy l'exécute lui-même si [tools.web_search] est
# activé plus bas, et l'ignore sinon (WebSearch ne rend alors rien).
# Table absente ou enabled = false → surface inactive (404), rien ne
# change pour les clients OpenAI.
[anthropic]
enabled = true
# En flux, pendant l'attente du limiteur : un `event: ping` toutes les
# N secondes tient la connexion (Claude Code coupe un flux muet ; l'API
# Anthropic envoie ces mêmes pings). Un 429 local devient alors un
# `event: error` dans le flux. 0 = attendre AVANT de répondre, comme pour
# un client OpenAI.
ping_interval = 10
# `reasoning_content` d'un backend (DeepSeek…) → bloc `thinking` visible
# dans Claude Code. false = jeté.
reasoning_as_thinking = true
# Une ligne de log par réponse /v1/messages : stop_reason, outils appelés
# (nom et extrait des arguments), tokens. À activer pour comprendre ce
# qu'un agent fait — ou répète — derrière le proxy.
trace = false

# Noms de modèles → noms PRÉFIXÉS du proxy. Claude Code envoie des noms
# Claude en dur pour ses tâches d'arrière-plan (titres, résumés…), même
# avec ANTHROPIC_MODEL défini : sans cette table ils partiraient en 400.
# Un suffixe entre crochets («claude-opus-5[1m]») est ignoré à la
# recherche. Un nom déjà préfixé par un backend passe tel quel.
# «default» attrape tout nom inconnu ; sans lui → 400.
[anthropic.model_map]
default = "albert/deepseek-v4-flash"
"claude-fable-5" = "albert/deepseek-v4-flash"
"claude-mythos-5" = "albert/deepseek-v4-flash"
"claude-opus-5" = "albert/deepseek-v4-flash"
"claude-opus-4-8" = "albert/deepseek-v4-flash"
"claude-opus-4-7" = "albert/deepseek-v4-flash"
"claude-opus-4-6" = "albert/deepseek-v4-flash"
"claude-opus-4-5" = "albert/deepseek-v4-flash"
"claude-sonnet-5" = "albert/deepseek-v4-flash"
"claude-sonnet-4-6" = "albert/deepseek-v4-flash"
"claude-sonnet-4-5" = "albert/deepseek-v4-flash"
"claude-haiku-4-5" = "albert/deepseek-v4-flash"
# Alias génériques que Claude Code accepte dans ANTHROPIC_MODEL.
"opus" = "albert/deepseek-v4-flash"
"sonnet" = "albert/deepseek-v4-flash"
"haiku" = "albert/deepseek-v4-flash"


# ── Surface Responses (Codex CLI) ───────────────────────────────────────
# Un client écrit pour l'API Responses d'OpenAI — Codex CLI — peut parler
# au proxy : POST /v1/responses est traduit en /v1/chat/completions (et la
# réponse, flux d'événements compris) vers le backend que désigne le
# préfixe du modèle. Aucun backend n'a besoin de servir /v1/responses.
# Dans ~/.codex/config.toml :
#
#   model = "bigchuck/qwen3.8-flash-next"
#   model_provider = "llm-proxy"
#   [model_providers.llm-proxy]
#   name = "llm-proxy"
#   base_url = "http://localhost:8000/v1"
#   wire_api = "responses"
#
# Les outils que seul OpenAI exécute (file_search, code_interpreter, mcp…)
# sont ignorés — sauf `web_search`, que le proxy exécute lui-même s'il est
# activé plus bas ([tools]) —, les `namespace` aplatis en fonctions, les
# champs sans effet tolérés. Aucun état de conversation côté proxy :
# previous_response_id → 400.
# Table absente ou enabled = false → surface inactive (404).
[responses]
enabled = true
# `reasoning_content` d'un backend → élément `reasoning` (résumé) visible
# dans le client. false = jeté.
reasoning_as_summary = true


# ── Outils hébergés sur /v1/chat/completions ────────────────────────────
# chat/completions n'a pas de forme standard pour un outil exécuté côté
# serveur. hosted_tools = true : une requête qui déclare dans `tools` la
# forme de l'API Responses — {"type": "web_search"} — ou le champ
# `web_search_options` d'OpenAI voit sa déclaration remplacée par les
# fonctions de [tools], et le proxy boucle (exécution, relance du
# backend) : le client reçoit UNE réponse ordinaire, sans `tool_calls`
# pour ces appels. Un outil déclaré mais désactivé plus bas → 400.
# À SAVOIR : le client ne garde ni ces appels ni leurs résultats. Le
# proxy les lui rend à la requête suivante tant que `memory` les garde
# (voir plus bas) ; sinon le modèle n'a plus ce qu'il avait lu, et le
# cache de préfixe du backend ne sert que jusqu'au message d'avant la
# recherche.
# Table absente ou hosted_tools = false → comme avant : relais brut, la
# déclaration part telle quelle au backend (qui la refuse, ou en a SA
# lecture — Zhipu). Une requête qui ne déclare rien n'est jamais touchée
# — sauf par `always`, ci-dessous.
[chat]
hosted_tools = true
# Outils présentés D'OFFICE à TOUTE requête /v1/chat/completions, sans
# déclaration : pour une interface de chat (Open WebUI), qui n'en fera
# jamais. Des NOMS d'outils hébergés — always = ["web_search",
# "web_fetch"] — présentés à la suite des outils du client ; la requête
# est ensuite traitée comme si elle les avait déclarés (boucle, réponse
# unique, annotations, mémoire). Vide ou absent = rien d'office (le
# défaut). Sans effet si hosted_tools est faux.
# Un nom inconnu, ou d'un outil désactivé plus bas, est ignoré avec un
# avertissement au démarrage (pas de 400 : le client n'a rien demandé).
# Rien n'est présenté d'office : à une requête qui dit `tool_choice:
# "none"` ou `n` > 1 ; à un modèle que le catalogue de son backend ne
# dit pas de conversation (image, voix, embeddings) ; pour un outil dont
# une fonction du client porte déjà le nom.
# À SAVOIR : le réglage vaut pour TOUS les clients de cette route et tous
# ses modèles. Un modèle de conversation qui ne sait pas appeler d'outils
# les reçoit quand même (le catalogue ne le dit pas), et les requêtes de
# service d'une interface (titre, tags, suggestions) aussi : rien ne les
# distingue. Un backend dont le `tool_choice` par défaut est `none`
# (Albert) n'appellera rien sans son force_tool_choice. Et le texte des
# pages web entre alors dans TOUTES les conversations, sans que le client
# l'ait demandé : voir l'avertissement d'injection de prompt de [tools].
always = []
# Annotations `url_citation` (forme OpenAI) en fin de réponse : les URL
# rendues par un outil ET écrites par le modèle. false = aucune.
annotations = true
# Mémoire des échanges cachés : à la conclusion d'une réponse, les appels
# hébergés et le texte de leurs résultats sont gardés sous un condensé
# des messages de la requête et de la réponse (aucun identifiant de
# conversation en chat/completions) ; à la requête suivante, si le client
# renvoie cette réponse et ce qui la précède inchangés, ils sont
# réinsérés à leur place avant l'envoi au backend. En mémoire vive
# seulement, cloisonnée par clé du proxy, jamais d'image ; nombre
# d'entrées et durée : [tools].cache_entries et cache_ttl. false = rien
# n'est gardé ni réinséré.
memory = true
# Caractères gardés au plus, toutes entrées confondues (un échange peut
# porter 8 résultats de 24 000 caractères) : au-delà, les moins
# récemment relus sortent.
memory_chars = 8000000


# ── Outils hébergés (surfaces Responses et Anthropic) ───────────────────
# Un client de l'API Responses — Codex CLI — déclare `{"type":
# "web_search"}` en comptant qu'OpenAI fera la recherche. Derrière ce
# proxy il n'y a pas d'OpenAI : c'est le proxy qui l'exécute. Il présente
# au modèle deux fonctions, `web_search` et `web_fetch`, exécute leurs
# appels, relance le backend avec le résultat, et ne rend au client que
# des éléments `web_search_call` terminés.
# Un client de l'API Messages — Claude Code, dont l'outil WebSearch envoie
# une sous-requête à part — déclare de même l'outil serveur `{"type":
# "web_search_20250305", "name": "web_search"}` en comptant sur Anthropic.
# Pour lui le proxy ne présente QUE `web_search` (Claude Code lit les
# pages sur le poste du client) et rend les blocs `server_tool_use` puis
# `web_search_tool_result` ; `max_uses`, `allowed_domains` et
# `blocked_domains` de l'outil sont respectés. Un client du SDK Anthropic
# qui déclare l'outil serveur `{"type": "web_fetch_20250910", "name":
# "web_fetch"}` reçoit de même `web_fetch`, rendu en blocs
# `server_tool_use` puis `web_fetch_tool_result` (`max_content_tokens`
# respecté aussi, `citations` ignoré).
# /v1/chat/completions en profite si [chat].hosted_tools ; rien n'est
# ajouté à une requête qui ne DÉCLARE pas l'outil — sauf sur cette route,
# pour les outils nommés par [chat].always.
# Tables absentes ou enabled = false → comme avant : `web_search` est
# ignoré, le modèle ne le voit pas.
#
# À SAVOIR avant d'activer : le texte d'une page web entre dans le
# contexte d'un agent qui exécute des commandes sur le poste du client.
# Une page peut porter des instructions écrites pour lui (injection de
# prompt) ; AUCUN réglage de ce fichier ne l'empêche.
[tools]
# Appels d'outils hébergés exécutés pour UNE réponse. Au-delà, le modèle
# reçoit une erreur qui lui demande de conclure avec ce qu'il a. Le
# `max_uses` d'un outil serveur Anthropic peut abaisser cette limite pour
# sa requête, jamais la relever.
max_calls = 8
# Délai (s) d'une exécution, tout compris (redirections suivies incluses) ;
# chaque outil a aussi le sien, plus court, par requête. Dépassé → une
# erreur rendue au modèle, jamais au client.
run_timeout = 60
# Taille (caractères) d'un résultat rendu au modèle ; le surplus est coupé
# et marqué «[truncated]».
max_result_chars = 24000
# Mémoire des résultats — la SEULE chose que le proxy conserve entre deux
# requêtes, et pour la surface Responses seulement (un client Anthropic
# renvoie le résultat avec l'appel : rien n'est gardé pour lui).
# Le client renvoie au tour suivant l'élément `web_search_call`
# SANS son résultat (OpenAI le garde côté serveur) : le proxy doit le
# rendre au modèle à l'identique, sinon il perd ce qu'il a lu et le préfixe
# change sous un backend à cache. Elle garde, par identifiant d'élément,
# le nom de la fonction, ses arguments tels que le modèle les a écrits, et
# le texte du résultat — rien d'autre. Cloisonnée par client : une entrée
# ne se relit qu'avec la clé (proxy.api_keys) qui l'a fait ranger, dont
# seul un condensé est gardé ; proxy ouvert = un seul client. En mémoire
# vive, jamais sur disque : un redémarrage du proxy la vide, le modèle
# reçoit alors à la place un mot qui lui dit de relancer l'outil.
# cache_entries : nombre d'appels gardés (les moins récemment relus
# sortent) ; cache_ttl : durée de vie (s) d'une entrée.
cache_entries = 512
cache_ttl = 86400
# Cache WEB (à ne pas confondre avec la mémoire ci-dessus, qui rend au
# modèle ce qu'il a déjà lu dans UNE conversation) : une page lue ou une
# recherche faite est gardée quelques minutes, pour ne pas la redemander au
# web. Une page longue lue en plusieurs morceaux n'est téléchargée qu'une
# fois, et une recherche identique ne repart pas chez les moteurs de
# SearXNG, qui bloquent vite une adresse trop pressante. Durée en secondes
# (0 = pas de cache) : courte, sinon une page d'actualité serait servie
# périmée. En mémoire vive, commun à tous les clients, succès seulement.
web_cache_ttl = 600
web_cache_entries = 256
web_cache_bytes = 64000000

# Recherche web, par une instance SearXNG (métamoteur libre, API JSON,
# sans clé) : le service `searxng` du docker-compose.
[tools.web_search]
enabled = true
# Base de l'instance ; le proxy appelle <searxng_url>/search?q=…&format=json.
# «http://searxng:8080» est le nom du service sur le réseau du compose :
# hors compose (uvicorn lancé à la main), mettre l'adresse réelle. Vide →
# l'outil répond au modèle que la recherche n'est pas configurée.
# C'est une adresse de CONFIGURATION, en général privée : le garde-fou des
# adresses publiques de [tools.net] ne s'y applique pas.
# SearXNG ne sert le JSON que si `search.formats` le liste
# (searxng/settings.yml) ; sinon 403, et l'erreur rendue au modèle le dit.
searxng_url = "http://searxng:8080"
# Délai (s) de la requête vers SearXNG, qui interroge lui-même plusieurs
# moteurs avant de répondre.
timeout = 20
# Résultats rendus quand le modèle ne précise pas `limit` (il peut en
# demander jusqu'à 20). Un résultat = titre, date, URL, extrait de 240
# caractères.
limit = 8
# Paramètres `language` («fr», «en-US»…) et `categories` («general»,
# «general,it»…) passés à SearXNG. Vides = non envoyés, les défauts de
# l'instance s'appliquent.
language = ""
categories = ""

# Lecture d'une page par son URL, pour que le modèle ouvre un résultat de
# la recherche — sans elle il n'en a que les extraits. Présentée au modèle
# en même temps que `web_search`, quand un client Responses déclare
# `web_search` ; à un client Anthropic, seulement s'il déclare l'outil
# serveur `web_fetch_…` (Claude Code ne le fait pas).
[tools.web_fetch]
enabled = true
# Délai (s) de chaque requête (une par saut de redirection, 5 sauts au plus).
timeout = 20
# Octets lus au plus sur le corps d'une page ; le reste n'est pas téléchargé.
max_bytes = 2000000
# La même borne pour un PDF (reconnu à son type ou à ses premiers octets),
# plus haute : un PDF coupé ne se lit pas. Au-delà, il est refusé.
pdf_max_bytes = 20000000
# Caractères de texte rendus par appel (HTML converti en texte ; JSON et
# texte tels quels ; texte extrait d'un PDF, sans OCR ; tout autre type
# refusé). Page plus longue : le modèle redemande la suite par `offset`.
max_chars = 20000
# Ce que `web_fetch` a le droit de joindre — adresses privées, listes de
# domaines — se règle dans [tools.net], pour tous les outils qui
# téléchargent.

# Garde-fou de TÉLÉCHARGEMENT, commun à tout ce que le proxy va chercher à
# la demande du modèle : une page (`web_fetch`), et tout outil qui lit un
# fichier par son URL. Une seule table : ce qu'un déploiement interdit de
# lire, il l'interdit partout. Les bornes de taille et de durée restent à
# chaque outil.
# Ces trois clés vivaient dans [tools.web_fetch] : elles y sont encore
# LUES si [tools.net] ne les pose pas, avec un avertissement au démarrage
# qui demande de les déplacer ici.
[tools.net]
# Garde-fou des adresses privées. La cible est choisie par le MODÈLE, et
# la requête part DU PROXY : sans filtre, une page web (ou un prompt)
# pourrait lui faire lire un service de son réseau — le backend
# d'inférence, l'instance SearXNG, un routeur, les métadonnées d'un cloud.
# false : seules les adresses PUBLIQUES sont jointes. Le nom est résolu par
# le proxy, TOUTES ses adresses doivent être publiques (ni privées, ni
# locales, ni lien local, ni CGNAT 100.64.0.0/10 — les adresses Tailscale —,
# ni réservées), la connexion part vers l'adresse vérifiée et non vers le
# nom, et le contrôle est refait à CHAQUE saut de redirection.
# true lève ce filtre : à n'ouvrir que sur un proxy dont tous les clients
# sont de confiance, et jamais derrière un modèle qui lit le web.
allow_private = false
# Listes de domaines, pour restreindre ce que le modèle peut ouvrir. Vides
# par défaut : tout domaine public est lu. `allowed_domains` non vide =
# SEULS ces domaines ; `blocked_domains` = jamais. Un domaine couvre ses
# sous-domaines ("github.com" couvre "docs.github.com"), un chemin
# restreint ("example.com/blog"). Contrôlées à chaque redirection. C'est
# la seule parade à la fuite par l'URL : une page lue qui pousse le modèle
# à ouvrir https://ailleurs/?d=<contenu de la conversation>.
# allowed_domains = ["github.com", "docs.python.org", "wikipedia.org"]
# blocked_domains = ["pastebin.com"]

# Lecture du texte d'une IMAGE ou d'un PDF SCANNÉ (OCR), par son URL. Pas
# de Tesseract : le texte est lu par un MODÈLE DE VISION qu'un backend de
# ce fichier relaie déjà — une requête chat/completions ordinaire, l'image
# en `image_url`. C'est le recours de `web_fetch`, qui ne lit ni une image
# ni un PDF sans couche texte (sa description y renvoie le modèle quand
# les deux lui sont présentés).
# Le fichier arrive par URL seulement, téléchargé par le proxy sous le
# garde-fou de [tools.net].
# Image : PNG, JPEG, GIF, WebP (reconnue à ses premiers octets). PDF : les
# images EMBARQUÉES dans ses pages (un scan = une image par page), pas un
# rendu de la page — JPEG repris tel quel, pixels bruts (gris, RVB)
# réécrits en PNG ; un scan codé en fax (CCITT, JBIG2) ou en JPEG 2000
# n'est pas lu, et l'erreur le dit.
# Sans liaison à l'API Responses ni à l'API Messages : l'outil se présente
# sur /v1/chat/completions — déclaré par {"type": "ocr"}
# ([chat].hosted_tools) ou d'office ([chat].always) — et s'appelle par
# POST /v1/tools/ocr.
# À SAVOIR : le texte lu dans une image entre dans le contexte du modèle
# comme celui d'une page web — une image peut porter des instructions.
[tools.ocr]
enabled = false
# Le modèle de vision, PRÉFIXÉ comme dans une requête d'un client. Son
# backend doit avoir `images = true`. Vide, préfixe inconnu, backend sans
# images, ou modèle que le catalogue ne dit pas multimodal → l'outil
# répond au modèle qu'il n'est pas configuré (la raison est dans le journal).
# Sur un backend à quotas, chaque page lue passe par son limiteur ; chaque
# requête laisse, en plus de la ligne d'usage de l'outil, une ligne de
# requête de ce modèle, endpoint «/v1/tools/ocr».
model = ""
# Durée (s) d'une exécution, téléchargement et lectures compris. Ce délai
# passé, les pages déjà lues sont rendues et le modèle redemande la suite.
# Il remplace [tools].run_timeout pour cet outil (10 s de marge en plus,
# le temps de rendre) : le monter suffit pour un modèle de vision lent.
timeout = 50
# Octets téléchargés au plus ; un fichier plus gros est refusé.
max_bytes = 20000000
# Octets d'UNE image envoyée au modèle de vision (en base64 dans le corps
# de la requête : un tiers de plus). Aucune image n'est redimensionnée.
max_image_bytes = 5000000
# Pages d'un PDF lues par appel — une requête au modèle de vision chacune ;
# le modèle demande les suivantes par l'argument `pages` ("5-8").
max_pages = 4
# Pages lues en même temps.
concurrency = 2
# Caractères de texte rendus par appel ; au-delà, les pages restantes sont
# à redemander (déjà lues, elles sortent du cache web).
max_chars = 20000
# `max_tokens` de chaque requête au modèle de vision (une page dense :
# 1 500 à 3 000 tokens) ; ramené à [backends.<nom>].max_tokens s'il est
# plus bas.
max_tokens = 4096

# Transcription d'un fichier audio : le modèle donne une URL, le proxy
# télécharge le fichier (sous le garde-fou de [tools.net]) et le confie au
# modèle de transcription d'un de ses backends (API OpenAI
# /v1/audio/transcriptions). Le fichier n'arrive QUE par URL.
# Sans liaison à l'API Responses ni à l'API Messages (aucune des deux n'a
# d'outil de ce nom) : l'outil se présente sur /v1/chat/completions —
# déclaré par {"type": "transcribe"} ([chat].hosted_tools) ou d'office
# ([chat].always) — et s'appelle par POST /v1/tools/transcribe.
[tools.transcribe]
enabled = false
# Le modèle de transcription, PRÉFIXÉ comme tout modèle du proxy :
# "<backend>/<modèle>". Vide, sans préfixe ou backend inconnu → l'outil
# répond au modèle que la transcription n'est pas configurée.
# C'est une adresse de CONFIGURATION : le garde-fou des adresses publiques
# ne s'y applique pas (il protège de l'URL choisie par le modèle).
# Chaque transcription laisse, en plus de la ligne d'usage de l'outil, une
# ligne de requête de ce modèle, endpoint «/v1/tools/transcribe».
model = ""
# model = "bigchuck/qwen3-asr-1.7b"
# Formats que CE modèle lit TELS QUELS, parmi : mp3, wav, flac, ogg, m4a,
# aac, webm, amr, mp4 (absent = tous). Vu le 07/10/2026 : Qwen3-ASR sous
# gufo ne lit que le WAV (tout autre format → HTTP 500).
# formats = ["wav"]
# Ce que `formats` ne liste pas est CONVERTI en WAV 16 kHz mono par ffmpeg
# avant l'envoi (il faut donc "wav" dans `formats`). L'image Docker du
# proxy embarque ffmpeg ; hors conteneur, s'il est absent, le proxy démarre,
# le dit, et ces formats sont refusés — comme avec `convert = false`, où
# la description de l'outil ne promet au modèle que `formats`.
# ffmpeg décode alors des octets venus du web : arguments fixes, format
# d'entrée imposé d'après les premiers octets, aucun protocole que `file`,
# dossier temporaire supprimé, délai et taille bornés — mais PAS isolé du
# proxy. `convert = false` pour refuser plutôt que décoder.
convert = true
# Le binaire : un nom cherché dans PATH, ou un chemin.
# ffmpeg = "ffmpeg"
# Délai (s) d'une conversion (s'ajoute au délai de l'outil), et octets du
# WAV produit au plus — 1,92 Mo par minute, 100 Mo ≈ 52 min ; au-delà le
# fichier est refusé, pas coupé. Tenu en mémoire le temps de l'envoi.
convert_timeout = 60
convert_max_bytes = 100000000
# Le `response_format` demandé au modèle de transcription. "verbose_json"
# rend aussi la langue entendue et la durée, que l'outil donne au modèle ;
# "json" (le texte seul) pour un backend qui refuse l'autre.
response_format = "verbose_json"
# Délai (s) de la requête de transcription, et délai (s) du téléchargement,
# redirections comprises. Leur SOMME (plus `convert_timeout` quand ffmpeg
# convertit) est le délai de l'outil : elle
# remplace [tools].run_timeout pour lui (une heure d'audio ne se
# transcrit pas en 60 s). Le client attend pendant ce temps.
timeout = 300
download_timeout = 60
# Octets téléchargés au plus. Au-delà le fichier est REFUSÉ, pas coupé
# (une transcription partielle passerait pour entière). 25 Mo ≈ 25 min de
# MP3 à 128 kbit/s. Le fichier est tenu en mémoire le temps de l'appel.
max_bytes = 25000000
# Caractères rendus par appel ; transcription plus longue : le modèle
# redemande la suite par `offset`, sans que rien soit retranscrit.
max_chars = 20000
# Langue passée au modèle de transcription quand l'appel n'en donne pas
# (code ISO 639-1 : "fr", "en"). Vide = il la détecte.
language = ""
# Cache des TRANSCRIPTIONS (le texte, jamais l'audio) : par URL et langue,
# en mémoire vive, commun à tous les clients. Plus long que le cache web :
# un enregistrement ne change pas, et le retranscrire coûte cher.
# cache_ttl en secondes (0 = pas de cache).
cache_ttl = 3600
cache_entries = 64

# Serveurs MCP (Model Context Protocol) : le proxy s'y connecte, découvre
# leurs outils, et chacun devient un outil hébergé — présenté au modèle
# sous le nom `<serveur>_<outil>`, exécutable par POST /v1/tools/<nom>.
# Sur /v1/chat/completions ([chat].hosted_tools), un client les déclare
# dans `tools` : `{"type": "mcp"}` (tous), `{"type": "mcp:<serveur>"}`
# (ceux d'un serveur) ou `{"type": "<serveur>_<outil>"}` (un seul) ;
# [chat].always les présente d'office, chacun par son nom
# `<serveur>_<outil>`. Pas de liaison à l'API Responses ni à l'API
# Messages : ces deux surfaces ne les présentent pas.
# HTTP seulement (transport « Streamable HTTP ») : le proxy ne lance aucun
# processus, pas de serveur stdio. La liste est FERMÉE : seuls les
# serveurs de ce fichier sont joints, jamais une URL venue d'un client ou
# du modèle.
#
# À SAVOIR avant d'activer :
#   * un outil exposé l'est à TOUS les clients du proxy, avec le compte
#     que portent les en-têtes ci-dessous. Personne ne confirme un appel :
#     n'exposez pas un outil qui écrit ou supprime sans l'avoir voulu
#     (`tools`, `exclude`) ;
#   * le nom, la description et le schéma de chaque outil, puis ses
#     résultats, sont du texte TIERS qui entre dans le prompt du modèle
#     (injection de prompt) : ne listez que des serveurs de confiance ;
#   * pas d'OAuth : en-têtes statiques seulement.
#
# Réglages communs à tous les serveurs (une sous-table = un serveur ; ces
# sept noms ne peuvent donc pas être des noms de serveur) :
# [tools.mcp]
# Délai (s) d'un appel d'outil, tout compris, et d'une découverte. Il
# remplace [tools].run_timeout pour ces outils.
# timeout = 30
# Période (s) entre deux découvertes (`tools/list`) d'un serveur : sa
# liste d'outils peut changer. Jamais plus souvent que la fraîcheur que
# le serveur annonce (`ttlMs`) ; après un échec, nouvel essai à 10 s,
# 20 s, 40 s… jusqu'à cette période. 0 = au démarrage seulement.
# refresh = 300
# Ce que le démarrage du proxy attend, au plus, de la première
# découverte. Un serveur éteint ne bloque pas : ses outils apparaissent
# quand il répond.
# startup_wait = 5
# Outils exposés par serveur, au plus : chacun pèse dans le prompt de
# toute requête qui les déclare.
# max_tools = 64
# Bornes de ce qu'un serveur fait entrer dans le prompt : description
# coupée au-delà, outil écarté si son schéma est plus gros.
# description_chars = 1024
# schema_chars = 8000
# Octets lus au plus sur une réponse du serveur.
# max_bytes = 4000000
#
# Un serveur : le nom de la table (lettres, chiffres, «_», «-») est son
# nom dans le journal et, sauf `prefix`, le préfixe de ses fonctions.
# [tools.mcp.docs]
# enabled = true
# L'adresse du point d'accès MCP. Une adresse de CONFIGURATION, qui peut
# être privée : le garde-fou des adresses publiques de [tools.net] ne
# s'y applique pas. Les redirections ne sont pas suivies.
# url = "http://mcp-docs:8000/mcp"
# En-têtes envoyés à chaque requête ; secrets par ${VAR}. Une variable
# absente : l'en-tête n'est pas envoyé, et le démarrage le signale.
# headers = { Authorization = "Bearer ${MCP_DOCS_TOKEN}" }
# Outils exposés, par leur nom CHEZ LE SERVEUR (jokers `*`, `?`) : `tools`
# non vide = seuls ceux-là ; `exclude` = jamais ceux-là.
# tools = ["search", "get_*"]
# exclude = ["delete_*"]
# Préfixe des noms de fonction (défaut : le nom de la table ; "" = aucun,
# à réserver à un serveur unique). Un nom de fonction est limité à 64
# caractères parmi [A-Za-z0-9_-] : tout autre caractère du nom MCP devient
# «_», un nom trop long est coupé et fini par un condensé.
# prefix = "docs"
# Propres à ce serveur, à la place des réglages communs :
# timeout = 30
# refresh = 300
# max_tools = 64
# Certificat TLS non vérifié (serveur interne auto-signé) :
# verify_ssl = true


# ── Statistiques ────────────────────────────────────────────────────────
[stats]
# Base SQLite : une ligne par requête servie, d'où les vues All/Week/Day
# et l'Usage API ; et une par exécution d'outil hébergé (des mesures,
# jamais ce qui est cherché ou lu). Chemin relatif = à côté de CE fichier.
database = "stats.db"
# Purge des lignes plus vieilles que N jours, requêtes et outils
# (0 = ne jamais purger).
retention_days = 90


# ── Quotas Albert ───────────────────────────────────────────────────────
[quotas]
# Marge de sécurité appliquée aux limites du compte (0.9 = 90 %).
margin = 0.9
# Rafraîchissement (s) des limites exactes via GET /v1/me/info.
limits_refresh = 3600
# Si l'attente nécessaire dépasse N secondes (quota JOURNALIER épuisé),
# le proxy renvoie un 429 local avec Retry-After plutôt que de bloquer
# la requête pendant des heures.
max_queue_seconds = 900
# Fallback n°3 : modèles ni dans /v1/me/info ni dans [quotas.family_limits].
generic_rpm = 30
generic_tpm = 128000
# Cartouche d'état (fenêtre locale, aucun appel réseau) dans les logs :
# au plus une toutes les N secondes, s'il y a du trafic (0 = désactivé).
status_interval = 600

# Mapping manuel routeur → préfixes de modèles, prioritaire sur la
# détection par signature. À utiliser si les logs signalent une famille
# non associée.
# [quotas.router_models]
# 3 = ["openweight-code", "qwen"]

# Fallback n°2 : quotas par FAMILLE (palier Expérimentation 08/2026),
# utilisés pour les modèles absents de /v1/me/info ou si l'endpoint est
# injoignable. `models` = préfixes matchés contre le champ `model`
# (le plus long gagne).
[quotas.family_limits.deepseek]
rpm = 50
tpm = 246000
models = ["deepseek"]

[quotas.family_limits.mistral]
rpm = 50
tpm = 128000
models = ["openweight-small", "openweight-medium", "mistral", "ministral"]

[quotas.family_limits.qwen]
rpm = 50
tpm = 128000
models = ["openweight-code", "qwen"]

[quotas.family_limits.gptoss]
rpm = 10
tpm = 128000
models = ["openweight-large", "gpt-oss"]


# ── Backends ────────────────────────────────────────────────────────────
# Le NOM de la table est le PRÉFIXE de routage : «albert/…» part vers
# [backends.albert], «bigchuck/…» vers [backends.bigchuck], préfixe retiré
# avant transfert. Tout modèle doit être préfixé : sans préfixe reconnu
# → 400. GET /v1/models interroge les backends en direct et renvoie le
# catalogue fusionné, ids préfixés.
#
# Champs : url (requis), api_key, quotas, timeout, meta_timeout,
# connect_timeout, verify_ssl, force_tool_choice.
#
# force_tool_choice — injection de `tool_choice` quand `tools` est présent
# sans `tool_choice` : absent/false = AUCUNE injection (le défaut) ;
# true = la valeur de proxy.tool_choice ; "auto"/"required"… = cette
# valeur-là. Seul Albert en a besoin (son schéma déclare «default: none»,
# ce qui casse le tool calling) ; llama.cpp non.

#
# max_tokens — plafond (0 ou absent = aucun) : la valeur du client est
# ramenée au plafond, jamais augmentée. Claude Code en demande 32 000
# par défaut, que certains backends refusent.
#
# images — le backend accepte les images (`image_url`) : les blocs image
# d'un client Anthropic (Claude Code lisant un .png) sont transmis aux
# modèles que SON catalogue déclare multimodaux (type image-text-to-text)
# — un modèle texte seul recevant une image est un 500 chez llama.cpp ;
# absent/false, ou modèle texte = «[image ignorée : image/png, 12 Ko]».
#
# tokenize_path — endpoint de tokenisation pour un count_tokens EXACT
# (llama.cpp : "/tokenize") ; absent = estimation à 4 caractères/token.
#
# model_types — type imposé à des modèles de ce backend, par motif (jokers
# shell, casse ignorée). Le type vient d'ordinaire du catalogue du backend
# (Albert le donne, llama.cpp le laisse déduire) ; un catalogue qui ne dit
# rien (llama-swap) est lu au NOM du modèle (image, tts, asr, embed…), et
# cette table corrige un nom qui trompe. Le type décide de ce qui est
# proposé à un client de chat (tableau de bord) et de qui reçoit les images.
#   [backends.bigchuck.model_types]
#   "mon-modele-voice-chat" = "text-generation"
#   "*-vision-*" = "image-text-to-text"

[backends.albert]
url = "https://albert.api.etalab.gouv.fr"
api_key = "${ALBERT_API_KEY}"
quotas = true
force_tool_choice = "auto"
# max_tokens = 8192

# Backend local llama.cpp : sans quota, pas toujours allumé — contacté
# uniquement à la demande, jamais sondé en tâche de fond ; éteint → 503
# backend_offline en 1 s (connect_timeout, poignée de main TCP seule —
# un hôte allumé répond bien avant, même occupé à générer).
[backends.bigchuck]
url = "http://bigchuck:8009"
# images = true
# tokenize_path = "/tokenize"
